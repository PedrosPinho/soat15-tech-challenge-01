name: CI/CD

# Fase 3: publica no ECR e faz deploy no EKS real de soat15-tech-challenge-k8s-infra,
# em vez do kind efêmero da Fase 2 (ver PHASE_3_PLAN.md, Etapa 7). Homolog e produção
# compartilham o mesmo cluster, separados por namespace — branch homolog -> namespace
# oficina-homolog, branch main -> namespace oficina-prod (ver k8s/README.md).
#
# Credenciais: sessão temporária do AWS Academy Learner Lab (sem OIDC — IAM bloqueado,
# não é possível criar identity provider). AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/
# AWS_SESSION_TOKEN em GitHub Secrets, renovados por scripts/refresh-aws-secrets.sh no
# início de cada sessão de trabalho — se o primeiro job do dia falhar com
# ExpiredToken/UnrecognizedClientException, rode o script de novo e reexecute.

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: soat15-tc-oficina-api
  EKS_CLUSTER_NAME: soat15-tc-cluster

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run type-check

      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: oficina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oficina -d oficina"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://oficina:ci-password@localhost:5432/oficina
      JWT_SECRET: ci-test-jwt-secret
      WEBHOOK_SECRET: ci-test-webhook-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Aplicar migrations (para o health.spec.ts, que precisa de um DB real)
        run: npm run db:migrate

      - name: Run tests with coverage
        # Além do serviço postgres acima (usado por health.spec.ts), os testes de
        # tests/infrastructure/database/postgres/ e o E2E em tests/integration/
        # sobem seus próprios containers via Testcontainers — runners do GitHub
        # Actions já têm acesso ao Docker do host, sem setup adicional.
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage-output.txt

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Cobertura de testes'
            echo '```'
            tail -n 40 coverage-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  docker-build-push:
    name: Build & Push (ECR)
    needs: [build, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        run: echo "image=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (EKS)
    needs: docker-build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Definir namespace/ambiente
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "NAMESPACE=oficina-prod" >> "$GITHUB_ENV"
            echo "TF_ENV=prod" >> "$GITHUB_ENV"
          else
            echo "NAMESPACE=oficina-homolog" >> "$GITHUB_ENV"
            echo "TF_ENV=homolog" >> "$GITHUB_ENV"
          fi

      - name: Namespace
        run: |
          sed "s/namespace: oficina$/namespace: $NAMESPACE/" k8s/namespace.yaml | \
            sed "s/name: oficina$/name: $NAMESPACE/" | kubectl apply -f -

      - name: Secret (endpoint/senha do RDS e JWT_SECRET vêm do SSM — nunca em arquivo)
        # DATABASE_URL/JWT_SECRET: lidos do SSM Parameter Store, nos parâmetros que
        # db-infra e auth-lambda já criam por workspace (ver rds.tf/ssm.tf naqueles
        # repositórios) — o endpoint do RDS não tem parâmetro próprio (só a senha),
        # então vem do describe-db-instances pelo identifier, que segue a mesma
        # convenção de nome (`${project_name}-${workspace}-...`).
        # WEBHOOK_SECRET: não é compartilhado com nenhuma Lambda, então não tem
        # parâmetro SSM — é um GitHub Secret próprio deste repositório.
        run: |
          DB_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier "soat15-tc-${TF_ENV}-db" \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/soat15-tc/${TF_ENV}/db/password" --with-decryption --query 'Parameter.Value' --output text)
          JWT_SECRET=$(aws ssm get-parameter --name "/soat15-tc/${TF_ENV}/jwt-secret" --with-decryption --query 'Parameter.Value' --output text)
          # A senha do RDS permite caracteres especiais (#, %, ?, [, ], etc. — ver
          # override_special em db-infra/rds.tf) que quebram a URL sem escapar.
          DB_PASSWORD_URLENC=$(jq -rn --arg v "$DB_PASSWORD" '$v|@uri')
          kubectl create secret generic oficina-api-secret -n "$NAMESPACE" \
            --from-literal=DATABASE_URL="postgres://oficina:${DB_PASSWORD_URLENC}@${DB_ENDPOINT}:5432/oficina?sslmode=no-verify" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --from-literal=NEW_RELIC_APP_NAME="oficina-api-${TF_ENV}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: ConfigMap
        run: |
          sed "s/namespace: oficina$/namespace: $NAMESPACE/" k8s/configmap.yaml | kubectl apply -f -

      - name: Job de migration (roda antes do rollout, apaga a execução anterior)
        run: |
          kubectl delete job oficina-migrate -n "$NAMESPACE" --ignore-not-found
          sed \
            -e "s/namespace: oficina$/namespace: $NAMESPACE/" \
            -e "s|image: oficina-api:local|image: ${{ needs.docker-build-push.outputs.image }}|" \
            k8s/job-migrate.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/oficina-migrate -n "$NAMESPACE" --timeout=120s

      - name: Job de seed (usuário admin + cliente de teste, idempotente)
        run: |
          kubectl delete job oficina-seed -n "$NAMESPACE" --ignore-not-found
          sed \
            -e "s/namespace: oficina$/namespace: $NAMESPACE/" \
            -e "s|image: oficina-api:local|image: ${{ needs.docker-build-push.outputs.image }}|" \
            k8s/job-seed.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/oficina-seed -n "$NAMESPACE" --timeout=120s

      - name: Deployment + Service + HPA
        run: |
          sed \
            -e "s/namespace: oficina$/namespace: $NAMESPACE/" \
            -e "s|image: oficina-api:local|image: ${{ needs.docker-build-push.outputs.image }}|" \
            k8s/deployment.yaml | kubectl apply -f -
          sed "s/namespace: oficina$/namespace: $NAMESPACE/" k8s/service.yaml | kubectl apply -f -
          sed "s/namespace: oficina$/namespace: $NAMESPACE/" k8s/hpa.yaml | kubectl apply -f -

      - name: Aguardar rollout
        run: kubectl rollout status deployment/oficina-api -n "$NAMESPACE" --timeout=180s

      - name: Smoke test /health/ready
        run: |
          kubectl port-forward svc/oficina-api 3001:3001 -n "$NAMESPACE" &
          sleep 5
          curl --fail --retry 5 --retry-delay 3 --retry-connrefused http://localhost:3001/health/ready

      - name: Debug temporário — logs do New Relic
        run: |
          kubectl exec -n "$NAMESPACE" deploy/oficina-api -- env | grep NEW_RELIC || echo "sem env NEW_RELIC no container"
          kubectl logs -l app=oficina-api -n "$NAMESPACE" --tail=300 | grep -i "newrelic\|new relic" || echo "nenhuma linha com newrelic nos logs"

      - name: Estado do cluster (debug em caso de falha)
        if: failure()
        run: |
          kubectl get all -n "$NAMESPACE"
          kubectl describe pods -n "$NAMESPACE"
          kubectl logs -l app=oficina-api -n "$NAMESPACE" --tail=200
          kubectl logs job/oficina-migrate -n "$NAMESPACE" --tail=200 || true
