# SonarCloud (Fase 4). O scan roda no CI (job com SONAR_TOKEN) a partir do lcov gerado pelo
# `npm run test:coverage`. A chave e a organização são as criadas ao importar o repositório
# em sonarcloud.io (padrão `<org>_<repo>`): confira os valores no painel do projeto.
sonar.organization=pedrospinho
sonar.projectKey=pedrospinho_soat15-tech-challenge-01
sonar.projectName=soat15-tech-challenge-01

sonar.sources=src
sonar.tests=tests
sonar.inclusions=src/**/*.ts
sonar.test.inclusions=tests/**/*.spec.ts,tests/**/*.test.ts
sonar.exclusions=node_modules/**,dist/**,coverage/**,src/index.ts,**/migrations/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
