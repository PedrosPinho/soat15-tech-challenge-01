# SonarQube Community LOCAL, usado para analisar os 3 serviços (Fase 4).
#   docker compose -f docker-compose.sonar.yml up -d      # http://localhost:9000
#   ./scripts/sonar-local.sh                               # testes + análise + quality gate
#   docker compose -f docker-compose.sonar.yml down        # (-v apaga também o histórico)
services:
  sonarqube:
    image: sonarqube:community
    ports: ['9000:9000']
    environment:
      # evita exigir `sysctl vm.max_map_count=262144` no host (só para uso local)
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
