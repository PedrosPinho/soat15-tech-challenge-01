services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: oficina
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oficina-network
    healthcheck:
      test: pg_isready -U oficina -d oficina
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: oficina-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    networks:
      - oficina-network

  # LocalStack: SNS + SQS locais para a Saga. O script de init cria o tópico, as filas
  # (com DLQ) e a assinatura com filter policy — espelha terraform/messaging.tf.
  localstack:
    image: localstack/localstack:3.8
    container_name: oficina-localstack
    restart: unless-stopped
    environment:
      SERVICES: sns,sqs
    ports:
      - '4566:4566'
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    networks:
      - oficina-network
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs list-queues >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    command: sh -c "npm run db:migrate && node dist/index.js"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://oficina:senha123@postgres:5432/oficina
      JWT_SECRET: change-this-in-production
      JWT_EXPIRES_IN: 1d
      BCRYPT_ROUNDS: 10
      INTERNAL_API_TOKEN: change-this-in-production
      # Saga / mensageria (Fase 4) via LocalStack; filas criadas por scripts/localstack-init.sh
      MESSAGING_DRIVER: sqs
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EXECUTION_COMMANDS_QUEUE_URL: http://localstack:4566/000000000000/execution-commands
      BILLING_COMMANDS_QUEUE_URL: http://localstack:4566/000000000000/billing-commands
      SAGA_REPLIES_QUEUE_URL: http://localstack:4566/000000000000/os-saga-replies
      EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:oficina-eventos
      BILLING_SERVICE_URL: http://billing-service:3003
      NOTIFICATION_PROVIDER: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_USER:
      SMTP_PASS:
      SMTP_FROM: no-reply@oficina.com
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      localstack:
        condition: service_healthy
    networks:
      - oficina-network
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
    name: tech-chl_postgres_data
    driver: local

networks:
  oficina-network:
    driver: bridge
