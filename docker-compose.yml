services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: oficina
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oficina-network
    healthcheck:
      test: pg_isready -U oficina -d oficina
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: oficina-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    networks:
      - oficina-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    command: sh -c "npm run db:migrate && node dist/index.js"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://oficina:senha123@postgres:5432/oficina
      JWT_SECRET: change-this-in-production
      JWT_EXPIRES_IN: 1d
      BCRYPT_ROUNDS: 10
      WEBHOOK_SECRET: change-this-in-production
      NOTIFICATION_PROVIDER: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_USER:
      SMTP_PASS:
      SMTP_FROM: no-reply@oficina.com
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - oficina-network
    volumes:
      - ./logs:/app/logs

  sonarqube:
    image: sonarqube:lts-community
    container_name: oficina-sonarqube
    restart: unless-stopped
    ports:
      - '9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - oficina-network
    healthcheck:
      test: wget -qO- http://localhost:9000/api/system/status | grep -q '"status":"UP"'
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: oficina-sonar-scanner
    depends_on:
      sonarqube:
        condition: service_healthy
    volumes:
      - .:/usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-admin}
    networks:
      - oficina-network
    profiles:
      - sonar

volumes:
  postgres_data:
    name: tech-chl_postgres_data
    driver: local
  sonarqube_data:
    name: tech-chl_sonarqube_data
    driver: local
  sonarqube_logs:
    name: tech-chl_sonarqube_logs
    driver: local
  sonarqube_extensions:
    name: tech-chl_sonarqube_extensions
    driver: local

networks:
  oficina-network:
    driver: bridge
