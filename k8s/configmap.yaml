apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-api-config
  namespace: oficina
data:
  NODE_ENV: "production"
  PORT: "3001"
  API_PREFIX: "/api"
  JWT_EXPIRES_IN: "1d"
  BCRYPT_ROUNDS: "10"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "*"
  # "ses" no EKS (ver ADR-005); "smtp" continua sendo o default do binário para
  # não depender de configuração extra em ambientes que não populam esta ConfigMap
  # (ex.: rodando fora do K8s). SES_FROM_EMAIL/AWS_REGION não são segredo — só o
  # que autentica no SES é a LabRole herdada pelos nós via instance profile.
  NOTIFICATION_PROVIDER: "ses"
  AWS_REGION: "us-east-1"
  SES_FROM_EMAIL: "no-reply@oficina.com"
  # Configura o agente `newrelic` (ver src/index.ts) só por env var, sem
  # newrelic.js — NEW_RELIC_LICENSE_KEY vem do Secret (vazia até existir uma
  # conta New Relic, ver ci-cd.yml); sem ela o agente fica desabilitado sem
  # erro. NEW_RELIC_APP_NAME é por ambiente, então é setado no Secret junto
  # com a license key (o pipeline já calcula $TF_ENV ali).
  NEW_RELIC_NO_CONFIG_FILE: "true"
  NEW_RELIC_LOG: "stdout"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  # --- Fase 4: Saga / mensageria ---------------------------------------------
  # URLs de fila/tópico NÃO ficam aqui: o CI as publica no ConfigMap
  # `oficina-api-messaging` a partir das saídas do Terraform (terraform/outputs.tf).
  MESSAGING_DRIVER: "sqs"
  MESSAGING_ENABLED: "true"
  # Prazos da Saga. Para a demonstração em vídeo, use valores curtos (ex.: 2m).
  SAGA_TIMEOUT_APROVACAO: "3d"
  SAGA_TIMEOUT_PAGAMENTO: "1h"
  SAGA_TIMEOUT_COMPENSACAO: "2m"
  SAGA_MAX_TENTATIVAS_COMPENSACAO: "3"
  SAGA_SWEEPER_INTERVAL_MS: "15000"
  OUTBOX_RELAY_INTERVAL_MS: "1000"
  # Billing no mesmo namespace (dashboard: receitaTotal; fallback null se fora).
  BILLING_SERVICE_URL: "http://billing-service:3003"
