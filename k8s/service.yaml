# ClusterIP: o tráfego externo entra pelo Ingress (ALB interno compartilhado, ver
# ingress.yaml e ADR-013), que aponta direto para os pods (target-type=ip).
# Antes (Fase 3) este Service era um LoadBalancer/NLB próprio, alvo do VPC Link;
# na Fase 4 há um único ALB para os três serviços.
apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
spec:
  type: ClusterIP
  selector:
    app: oficina-api
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
