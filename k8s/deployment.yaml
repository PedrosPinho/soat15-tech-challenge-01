apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: oficina-api
          # Substituída em tempo de deploy pelo CI/CD (.github/workflows/ci-cd.yml,
          # sed na tag do ECR = SHA do commit) — ver k8s/README.md para uso local
          # com kind, onde a imagem é carregada manualmente em vez de puxada de um
          # registry.
          image: oficina-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # /health/live nunca toca o banco (só confirma que o processo está de
            # pé) — de propósito distinto de /health/ready, que retorna 503 se o
            # Postgres estiver inalcançável. Reiniciar o pod não resolve um
            # problema de banco; isso é papel da readinessProbe, que apenas tira
            # o pod do Service até a conexão voltar.
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
