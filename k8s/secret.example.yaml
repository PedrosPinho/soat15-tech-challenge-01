# Template do Secret usado pela API no namespace `oficina`.
#
# NÃO aplique este arquivo diretamente em um cluster real. Ele existe apenas para
# documentar as chaves esperadas. O pipeline de CI/CD (.github/workflows/ci-cd.yml)
# monta o Secret de verdade em tempo de deploy, lendo `DATABASE_URL`/`JWT_SECRET`/
# `WEBHOOK_SECRET` do SSM Parameter Store (ver PHASE_3_PLAN.md, Etapa 1/2) — nenhum
# valor real fica em texto plano neste repositório.
#
# Para testar localmente contra um cluster próprio (kind), use o comando imperativo:
#
#   kubectl create namespace oficina --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic oficina-api-secret -n oficina \
#     --from-literal=DATABASE_URL="postgres://oficina:SENHA_REAL@host:5432/oficina" \
#     --from-literal=JWT_SECRET=SEGREDO_REAL \
#     --from-literal=WEBHOOK_SECRET=SEGREDO_REAL
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secret
  namespace: oficina
type: Opaque
stringData:
  DATABASE_URL: "postgres://oficina:CHANGE_ME@CHANGE_ME:5432/oficina"
  JWT_SECRET: "CHANGE_ME"
  WEBHOOK_SECRET: "CHANGE_ME"
